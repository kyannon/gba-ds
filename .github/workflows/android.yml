# Builds the Android APK on every push to android / dev (and by hand from
# the Actions tab). The APK is attached to the run as an artifact.
#
# Signing: the repository secrets ANDROID_KEYSTORE_B64 (the keystore,
# base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Every build must be signed with the same key, or Android refuses to install
# it over the previous one. Without the secrets the APK is debug-signed.
name: Android

on:
  push:
    branches: [android, dev]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    # A normal run takes 2-3 minutes; this covers a run with an empty Gradle
    # cache and the second attempt below, and ends a hung download.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's downloads (the Android Gradle plugin, its dependencies, Gradle
      # itself) are kept between runs. By default setup-gradle only saves its
      # cache on the default branch (main), where this workflow never runs, so
      # every run downloaded everything from Maven Central again, and Maven
      # Central sometimes refuses GitHub's shared runners with HTTP 429.
      # Saving on every branch: a branch's later runs, and dev's and android's,
      # start from their own cache (a new branch's first run can't see dev's).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
          cache-read-only: false

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gba-ds.jks"
            echo "GBADS_KEYSTORE=$RUNNER_TEMP/gba-ds.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK is debug-signed and won't install over a release-signed one."
          fi

      - name: Build
        env:
          GBADS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GBADS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GBADS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One more try after a wait when Maven Central (or the plugin portal,
        # which relays to it) answered HTTP 429 "Too Many Requests": a rate
        # limit on GitHub's shared runners, not a fault in the code. Any other
        # failure, or a second 429, fails the run as before.
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          set -o pipefail
          log="$RUNNER_TEMP/build.log"
          if scripts/build-android.sh 2>&1 | tee "$log"; then exit 0; fi
          if ! grep -qE "status code 429|Too Many Requests" "$log"; then exit 1; fi
          echo "::warning title=Maven Central rate limit::A download got HTTP 429 (Too Many Requests); trying the build once more in 90 seconds."
          cp "$log" "$RUNNER_TEMP/build-attempt1.log"
          sleep 90
          scripts/build-android.sh 2>&1 | tee "$log"

      # The end of the log as an annotation, readable from the run page (and
      # the public API) without downloading the logs.
      - name: Report failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          msg=$(grep -iE "error|fail|what went wrong" "$RUNNER_TEMP/build.log" | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::$msg"
          msg=$(tail -n 40 "$RUNNER_TEMP/build.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=End of build log::$msg"

      - name: Version
        id: v
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          # for the release notes: the APK's own checksum (the artifact digest is the zip's)
          echo "::notice title=APK SHA-256::$(cd dist && sha256sum gba-ds-*-android.apk)"

      - uses: actions/upload-artifact@v4
        with:
          name: gba-ds-v${{ steps.v.outputs.version }}-android
          path: dist/gba-ds-*-android.apk
          if-no-files-found: error
