# gba-ds settings. Every option can also be given on the command line
# (e.g. --swap, --map-interval=60). Lines starting with # are ignored.
# Swapping screens from the in-game menu is remembered in states/prefs.cfg,
# which overrides "swap" below.

# Library: folders scanned for .gba files (subfolders included).
# Separate several folders with ':'.
rom_dir = /storage/roms/gba
# Only games with a map screen are listed. Set to 1 to list every .gba
# (games without map support play normally on one screen).
show_all = 0
# Game names leave out tags like (USA) and (En,Fr,De); the flag tells
# regional copies apart. Set to 1 to keep them.
name_tags = 0

# RetroAchievements, casual mode. auto = on when RetroAchievements is
# switched on in EmulationStation with an account signed in (ROCKNIX's
# system.cfg). 1 = on, 0 = off. ra_username / ra_password: another account
# than EmulationStation's.
retroachievements = auto
#ra_username =
#ra_password =

# Save a state when you leave a game (save_on_quit), and pick up from it
# when you start the game again (auto_load). The pause menu's Extras page
# switches both too, and remembers that over these.
save_on_quit = 1
auto_load = 1

# Keep the quick bar (swipe up from the bottom of the touchscreen) up, as
# its pin does.
quick_bar_pinned = 0

# At a game's start, a hint at the bottom of the touchscreen: "Swipe up
# for quick menu" (gone after 3 seconds or at the first touch).
quick_bar_hint = 1

# Look for a new GBA DS release once a day when the game list opens, and
# ask before downloading it (Settings > Updates in the game list switches
# this too, and checks by hand). 0 = don't look.
update_check = 1

# Screen arrangement. auto = detect. span-h / span-v = one window covering
# both screens side by side / stacked. dual = one window per display.
# single = one screen; HOME + Y (or the pause menu's Swap Screens) flips
# between game and map.
layout = auto
# Show the map on the first screen and the game on the second.
swap = 0

# Which screen has the touch panel (the menu and game list go there),
# and whether touch coordinates span the whole window or just that screen.
# If taps land in the wrong place, try touch_map = screen.
touch_screen = second
touch_map = window
# Read the touchscreen straight from its input device (/dev/input/eventN)
# when the system passes GBA DS no touches (found by itself on the RG DS
# Plus's Stock Linux OS), and how its picture is turned: 0, 90, 180 or 270
# degrees (-1: by the panel's shape). Empty: SDL's touches.
touch_device =
touch_rotate = -1

# Scaling for the game and the map (both can also be changed in the pause menu):
#   integer = pixel perfect (4x on the RG DS Plus, small black border)
#   fit     = full width (fills the screen width, keeps the shape; stays sharp)
#   zoom    = fill the screen height, keeps the shape; the left and right
#             edges of the picture are cut off
#   stretch = fill the whole screen (distorts the shape)
scale = integer
map_scale = integer
# A pattern over every pixel on both screens (also in the pause menu: Shader).
#   off, grid (LCD grid), scanlines, soft (soft cells), subpixels-light,
#   subpixels, subpixels-strong (red, green and blue stripes: light for a dim
#   screen, strong for a bright one). Runs on the GPU.
shader = off
# How dark the grid, scanlines and soft cells are, 0-100.
lcd_strength = 35
# Plain bilinear filtering instead of sharp scaling (blurry; usually leave off).
smooth = 0
# Each frame of the game shown half and half with the one before, as on a
# GBA's slow screen (also in the pause menu: LCD Ghosting).
lcd_ghosting = 0
vsync = 0
# Run the game at the display's refresh rate (60 Hz: 0.46% faster than the
# GBA's 59.73 frames a second, sound resampled to match) and present in step
# with it, so no frame is shown twice: on a 60 Hz screen the GBA's own rate
# repeats a frame about every 3.7 s, a small regular stutter. Only if the
# display's rate is within 1.5% of the GBA's. Also in the pause menu
# (Display: Match Display Rate).
match_display = 0
# Rewind: hold L2 to go back in time, up to rewind_seconds (5-300; about
# 1 MB of memory a second). Also in the pause menu (Extras).
rewind = 1
rewind_seconds = 30

# Where "Take Screenshot" (pause menu) saves its PNGs.
screenshot_dir = /storage/roms/screenshots

# RetroArch cheat folders (.cht files, searched two levels deep), ':'-separated.
cheat_dir = /config/retroarch/cheats:/storage/.config/retroarch/cheats

# EmulationStation's config folder, where Settings > GBA DS in EmulationStation
# puts es_systems_gbads.cfg and gbads-launch.sh.
es_config_dir = /storage/.config/emulationstation

# Overlays (also in the pause menu, Display > Overlays): off; generated,
# GBA DS's bezel round the picture, drawn in the colours below; or custom,
# your own PNGs in overlays/ (a screen without one gets the bezel in its
# default colours). See https://github.com/kyannon/gba-ds/wiki/Overlays
overlays = generated
# Which screens have them: both, top or bottom
overlay_screens = both
# The generated bezel: the GBA DS logo in it (1 / 0), and its colours (RRGGBB)
bezel_logo = 1
bezel_inner = 1A1A1A
bezel_outer = 102060
# Colour behind the map image where nothing else is drawn (RRGGBB).
border_color = 000000

# Map refresh. The map also refreshes right after every room transition.
# map_interval: frames (60 a second) between refreshes; 60 = every second.
# Shorter keeps the map more up to date, but each refresh runs the hidden
# copy of the game for a moment on another CPU core: on a slower device,
# very short intervals can make the sound crackle (the log reports it).
map = 1
map_interval = 60
# Metroid maps: the whole pause screen with its frame, tidied: labels erased;
# scroll arrows, clock and button prompts left out; Zero Mission's corner
# minimap replaced by the map under it. 0 shows the pause screens exactly as
# the games draw them.
map_crop = 1
# Blinking map markers. 0 shows one still frame, with every marker that blinks
# showing. (Some games' maps are always still: A Link to the Past.)
map_animations = 1
# The game's logo on the second screen when there's nothing else to show
# (title screens, menus, before the first map); 0 keeps it blank.
show_logo = 1
# A folder of scraped logos (EmulationStation's marquees, Skraper's wheels),
# PNG or JPG, found by the ROM's file name whatever the details in brackets:
# "Golden Sun.png" or "Golden Sun-marquee.jpg" for "Golden Sun (USA).gba".
# Empty: not used. Your own logos/<CODE>.png still comes first.
logo_folder =
# Your own and scraped logos, made as tall as the logo taken from the game:
# pixelated (shrunk to the GBA's pixels), full (their detail, the same size)
# or off (the logo taken from the game). Also in the pause menu: Display >
# Custom Logos.
custom_logos = pixelated

# Buttons. By default GBA A is the right face button and GBA B the bottom one,
# like a GBA. Set ab_swap = 1 to flip them.
ab_swap = 0

# The hotkey button, held with another button for a shortcut: home, select,
# start or l3 (also Settings > Hotkeys in the game list, which wins once used).
# Each shortcut's button: a, b, x, y, l, r, l2, r2, select, start, l3, up,
# down, left, right, or none. HOME always opens the menu.
hotkey = home
hotkey_quit = start
hotkey_save_state = r
hotkey_load_state = l
hotkey_quick_menu = x
hotkey_swap_screens = y
hotkey_shader = b
# If HOME does nothing, launch once with GBADS_DEBUG=1, press it, and put
# the "raw joystick ... button N" number from gba-ds.log here.
home_button = -1

# Open the menu by pressing SELECT and START together (select+start), e.g.
# if HOME is awkward to reach. The game doesn't see the pair.
menu_combo = none

# FPS and % of full speed in the corner of the game screen (the quick bar,
# HOME + X, shows the FPS too).
show_fps = 0
audio_latency = 64
ff_speed = 3

# Battery saves (.sav): empty = next to the ROM. An existing RetroArch .srm
# is copied to .sav the first time you play a game.
save_dir =
# Save states, resume points and library thumbnails: empty = states in
# GBA DS's data folder (below)
state_dir =

# GBA DS's data folder: states/ (settings, save states, resume points),
# cheats/, overlays/, logos/, patches/ and bug-reports/. They're in this
# folder unless you choose another: make a file called data-folder.cfg
# here, beside gba-ds.cfg, with one line, for example
#   data_dir = /storage/roms/gba-ds-data
# (the folder it goes in must already exist; GBA DS makes the last one)
# GBA DS moves its files there the next time it starts (and back here if
# you take the line out). data-folder.cfg is yours: updates leave it as it
# is, and so does unzipping a new version over this one.
